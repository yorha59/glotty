name: Build Glotty DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    # act_runner spawns each step's shell with a stripped PATH
    # (login defaults from launchd, no .zshrc). Homebrew installs
    # to /opt/homebrew on Apple Silicon and isn't on that PATH —
    # so `brew install xcodegen` and any other Homebrew-installed
    # tool (xcodegen, the Apple Silicon openssl, ...) silently
    # "command not found" and the build proceeds with a stale
    # xcodeproj. Set PATH at the job level so every step inherits it.
    env:
      PATH: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build, sign, notarize, staple DMG
        # The signed script handles build + sign + DMG + notarize +
        # staple end-to-end. Prerequisites the runner must have set
        # up once before this works:
        #   1. Developer ID Application certificate installed in the
        #      runner's login keychain (plus Apple intermediates).
        #   2. notarytool credentials stored under profile name
        #      `glotty-notary`:
        #         xcrun notarytool store-credentials "glotty-notary" \
        #             --apple-id hemoon@outlook.com \
        #             --team-id 47D8DFFZQ4
        #   3. ~/projects/miner/.keychain-pass containing the runner
        #      user's login password (chmod 600). The script reads
        #      this to unlock the keychain at job start — act_runner
        #      job sessions don't inherit the user's keychain unlock.
        # See doc/release-pipeline.md for the full runner setup steps.
        env:
          KEYCHAIN_PASS_FILE: /Users/sichengzu/projects/miner/.keychain-pass
        run: bash scripts/make-dmg-signed.sh

      - name: Copy artifact to persistent location
        run: |
          mkdir -p ~/ci-artifacts/glotty
          cp dist/*.dmg ~/ci-artifacts/glotty/
          echo "=== Artifacts ==="
          ls -lh ~/ci-artifacts/glotty/

      - name: Publish to Gitea Release
        # `--ipv4` forces curl to skip IPv6 resolution. On this
        # network, truenas.local's mDNS reply includes a link-local
        # IPv6 address that the runner can't actually route to —
        # without --ipv4, curl picks the IPv6 first and fails with
        # "no route to host". Same fix applied to act_runner's own
        # config (.runner uses the IPv4 IP directly).
        run: |
          GITEA_TOKEN=$(cat ~/projects/miner/.git-token)
          DMG_FILE=$(ls dist/*.dmg | head -1)
          DMG_NAME=$(basename "$DMG_FILE")
          RELEASE_TAG="latest-build"
          API="http://truenas.local:30008/api/v1/repos/hemoon/glotty"

          # Delete old release
          curl -sf --ipv4 -X DELETE \
            -H "Authorization: token $GITEA_TOKEN" \
            "$API/releases/tags/$RELEASE_TAG" 2>/dev/null || true

          # Create release
          RELEASE_ID=$(curl -sf --ipv4 -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"Latest Build\",\"body\":\"Auto-built DMG from main branch\",\"target_commitish\":\"main\"}" \
            "$API/releases" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")

          echo "Release ID: $RELEASE_ID"

          # Upload DMG
          curl -sf --ipv4 -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -F "attachment=@$DMG_FILE" \
            "$API/releases/$RELEASE_ID/assets?name=$DMG_NAME" | python3 -c "
          import json,sys
          r=json.load(sys.stdin)
          print('Uploaded:', r.get('name','?'), f\"({r.get('size','?')} bytes)\")
          print('Download:', r.get('browser_download_url','?'))"
