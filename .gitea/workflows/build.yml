name: Build Glotty PKG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    # act_runner spawns each step's shell with a stripped PATH
    # (login defaults from launchd, no .zshrc). Homebrew installs
    # to /opt/homebrew on Apple Silicon and isn't on that PATH —
    # so `brew install xcodegen` and any other Homebrew-installed
    # tool (xcodegen, the Apple Silicon openssl, ...) silently
    # "command not found" and the build proceeds with a stale
    # xcodeproj. Set PATH at the job level so every step inherits it.
    env:
      PATH: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build, sign, notarize, staple PKG
        # The .pkg is the sole release artifact. A .pkg installs via
        # Installer.app, which writes the app to /Applications as root,
        # so the INSTALLED app carries no com.apple.quarantine flag —
        # even when the .pkg is delivered through a sandboxed messenger
        # (Feishu/WeChat) that otherwise stamps a sandbox-origin
        # quarantine Gatekeeper refuses to launch ("File created by an
        # AppSandbox, exec/open not allowed"). Zero-Terminal install;
        # proven end-to-end 2026-06-05 (Feishu-delivered pkg -> clean,
        # Gatekeeper-accepted install). See doc/release-pipeline.md.
        #
        # make-pkg-signed.sh handles build + sign (Developer ID
        # Application) + notarize + staple the app, then pkgbuild + sign
        # (Developer ID Installer) + notarize + staple the .pkg.
        #
        # Runner prerequisites (one-time, see doc/release-pipeline.md):
        #   1. `Developer ID Application` cert in the CI keychain.
        #   2. `Developer ID Installer` cert in the CI keychain (§3) —
        #      signs the .pkg wrapper; without it pkgbuild fails with
        #      "No installer signing identity found".
        #   3. notarytool credentials under profile `glotty-notary`.
        #   4. ~/projects/miner/.keychain-pass (chmod 600) — the CI
        #      keychain password; the script unlocks with it because
        #      act_runner job sessions don't inherit a keychain unlock.
        env:
          KEYCHAIN_PASS_FILE: /Users/sichengzu/projects/miner/.keychain-pass
        run: bash scripts/make-pkg-signed.sh

      - name: Copy artifact to persistent location
        run: |
          mkdir -p ~/ci-artifacts/glotty
          cp dist/*.pkg ~/ci-artifacts/glotty/
          echo "=== Artifacts ==="
          ls -lh ~/ci-artifacts/glotty/

      - name: Publish to Gitea Release
        # `--ipv4` forces curl to skip IPv6 resolution. On this
        # network, truenas.local's mDNS reply includes a link-local
        # IPv6 address that the runner can't actually route to —
        # without --ipv4, curl picks the IPv6 first and fails with
        # "no route to host". Same fix applied to act_runner's own
        # config (.runner uses the IPv4 IP directly).
        run: |
          GITEA_TOKEN=$(cat ~/projects/miner/.git-token)
          PKG_FILE=$(ls dist/*.pkg | head -1)
          PKG_NAME=$(basename "$PKG_FILE")
          RELEASE_TAG="latest-build"
          API="http://truenas.local:30008/api/v1/repos/hemoon/glotty"

          # Delete old release
          curl -sf --ipv4 -X DELETE \
            -H "Authorization: token $GITEA_TOKEN" \
            "$API/releases/tags/$RELEASE_TAG" 2>/dev/null || true

          # Create release
          RELEASE_ID=$(curl -sf --ipv4 -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"Latest Build\",\"body\":\"Auto-built from main branch. Double-click the .pkg to install — works via Feishu/WeChat with no Terminal.\",\"target_commitish\":\"main\"}" \
            "$API/releases" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")

          echo "Release ID: $RELEASE_ID"

          # Upload PKG (sole release artifact)
          curl -sf --ipv4 -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -F "attachment=@$PKG_FILE" \
            "$API/releases/$RELEASE_ID/assets?name=$PKG_NAME" | python3 -c "
          import json,sys
          r=json.load(sys.stdin)
          print('Uploaded:', r.get('name','?'), f\"({r.get('size','?')} bytes)\")
          print('Download:', r.get('browser_download_url','?'))"
