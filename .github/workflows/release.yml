name: Release (Developer ID signed + notarized)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + sign + notarize + verify, but skip GitHub Release creation"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned universal app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select newest Xcode 26
        run: |
          set -euo pipefail
          XC=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build without signing credentials
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -scheme Glotty -configuration Release \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' CODE_SIGN_ENTITLEMENTS='' \
            ENABLE_HARDENED_RUNTIME=YES build | tail -40
          APP="$RUNNER_TEMP/derived/Build/Products/Release/Glotty.app"
          lipo "$APP/Contents/MacOS/Glotty" -verify_arch arm64 x86_64
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/unsigned-app.zip"

      - name: Upload unsigned app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-app
          path: ${{ runner.temp }}/unsigned-app.zip
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign and notarize approved main build
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 75
    # Server-side branch restriction + approval; a YAML guard alone is bypassable.
    environment: release-signing
    outputs:
      pkg_name: ${{ steps.metadata.outputs.pkg_name }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout signing scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download unsigned app from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-app
          path: ${{ runner.temp }}/unsigned

      - name: Unpack and validate unsigned app before loading secrets
        run: |
          set -euo pipefail
          ditto -x -k "$RUNNER_TEMP/unsigned/unsigned-app.zip" "$RUNNER_TEMP/unsigned"
          APP="$RUNNER_TEMP/unsigned/Glotty.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = com.ruojunye.glotty
          lipo "$APP/Contents/MacOS/Glotty" -verify_arch arm64 x86_64

      - name: Sign, notarize, verify, then remove all signing credentials
        env:
          PREBUILT_APP_PATH: ${{ runner.temp }}/unsigned/Glotty.app
          # New names intentionally prevent fallback to old repository secrets.
          MACOS_SIGNING_P12_BASE64: ${{ secrets.RELEASE_MACOS_SIGNING_P12_BASE64 }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.RELEASE_MACOS_INSTALLER_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.RELEASE_MACOS_SIGNING_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.RELEASE_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.RELEASE_APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/ci-sign-pkg.sh

      - name: Compute SHA-256 and metadata after credential cleanup
        id: metadata
        run: |
          set -euo pipefail
          PKGS=(dist/Glotty-*.pkg)
          test "${#PKGS[@]}" -eq 1
          test -f "${PKGS[0]}"
          PKG_NAME="${PKGS[0]#dist/}"
          VERSION="${PKG_NAME#Glotty-}"
          VERSION="${VERSION%.pkg}"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          (cd dist && shasum -a 256 "$PKG_NAME" > "$PKG_NAME.sha256")
          echo "pkg_name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload signed package after credential cleanup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-package
          path: |
            dist/${{ steps.metadata.outputs.pkg_name }}
            dist/${{ steps.metadata.outputs.pkg_name }}.sha256
          if-no-files-found: error

  publish:
    name: Publish verified package
    needs: sign
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed package from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-package
          path: dist

      - name: Create GitHub Release (never overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_NAME: ${{ needs.sign.outputs.pkg_name }}
          PKG_VERSION: ${{ needs.sign.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check "$PKG_NAME.sha256")
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="v${PKG_VERSION}-${SHORT_SHA}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists — refusing to overwrite."
            exit 1
          fi
          printf '%s\n' 'Automated Developer ID signed + notarized build.' '' \
            "- Commit: $GITHUB_SHA" "- Tag: $TAG" \
            '- Bundle ID: com.ruojunye.glotty' '- Team: 47D8DFFZQ4 (Simon Zu)' \
            '- Universal: arm64 + x86_64' "- SHA-256: see $PKG_NAME.sha256" > release-notes.txt
          gh release create "$TAG" "dist/$PKG_NAME" "dist/$PKG_NAME.sha256" \
            -R "$GITHUB_REPOSITORY" --title "Glotty $PKG_VERSION (${SHORT_SHA})" \
            --notes-file release-notes.txt \
            --target "$GITHUB_SHA"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url -q .url
