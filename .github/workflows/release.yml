name: Release (Developer ID signed + notarized)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + sign + notarize + verify, but skip GitHub Release creation"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, release
    runs-on: macos-26
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun notarytool --version || true

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      # ---------------------------------------------------------------------------
      # Temp keychain named "glotty-ci.keychain-db" on purpose: scripts/make-pkg-signed.sh
      # CI mode (KEYCHAIN_PASS_FILE set) resolves exactly this name and unlocks it
      # with the password from that file. Keychain password == P12 password here.
      # ---------------------------------------------------------------------------
      - name: Create temp keychain and import signing identities
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MACOS_SIGNING_P12_BASE64" | base64 --decode > /tmp/glotty-app.p12
          echo "$MACOS_INSTALLER_P12_BASE64" | base64 --decode > /tmp/glotty-installer.p12
          KC="$HOME/Library/Keychains/glotty-ci.keychain-db"
          security create-keychain -p "$MACOS_SIGNING_P12_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$MACOS_SIGNING_P12_PASSWORD" "$KC"
          security import /tmp/glotty-app.p12 -k "$KC" \
            -P "$MACOS_SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security
          security import /tmp/glotty-installer.p12 -k "$KC" \
            -P "$MACOS_SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security
          # -T plus partition list => non-interactive signing in CI
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_SIGNING_P12_PASSWORD" "$KC"
          # Put temp keychain first in the search list (keep existing entries)
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
          security find-identity -v "$KC"
          rm -f /tmp/glotty-app.p12 /tmp/glotty-installer.p12

      - name: Store notarytool credentials in temp keychain
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials glotty-notary \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id 47D8DFFZQ4 \
            --keychain "$HOME/Library/Keychains/glotty-ci.keychain-db"

      - name: Build Release (universal) + sign + notarize + staple + pkg
        env:
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$MACOS_SIGNING_P12_PASSWORD" > /tmp/glotty-kc-pass
          chmod 600 /tmp/glotty-kc-pass
          export KEYCHAIN_PASS_FILE=/tmp/glotty-kc-pass
          bash scripts/make-pkg-signed.sh 2>&1 | tee build.log | tail -40

      - name: Compute SHA-256 + collect metadata
        run: |
          set -euo pipefail
          cd dist
          PKG=$(ls Glotty-*.pkg | head -1)
          shasum -a 256 "$PKG" > "$PKG.sha256"
          cat "$PKG.sha256"
          echo "PKG_NAME=$PKG" >> "$GITHUB_ENV"
          echo "PKG_PATH=dist/$PKG" >> "$GITHUB_ENV"
          VERSION="${PKG#Glotty-}"; VERSION="${VERSION%.pkg}"
          echo "PKG_VERSION=$VERSION" >> "$GITHUB_ENV"
          cd ..
          # Sanity: the app inside the pkg is a universal binary
          APP=$(find /private/var/tmp -maxdepth 6 -name Glotty.app 2>/dev/null | head -1 || true)
          echo "--- artifact inventory ---"
          ls -lh dist/

      - name: Verify signatures / notarization / staple
        run: |
          set -euo pipefail
          echo "=== pkgutil --check-signature ==="
          pkgutil --check-signature "$PKG_PATH" | sed -n '1,14p'
          echo "=== spctl --assess --type install ==="
          spctl --assess --type install --verbose "$PKG_PATH"
          echo "=== stapler validate ==="
          xcrun stapler validate "$PKG_PATH"
          echo "=== Bundle ID + signature authority of staged app (from build.log context) ==="
          echo "PKG=$PKG_NAME VERSION=$PKG_VERSION"

      - name: Upload pkg + sha256 as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: |
            ${{ env.PKG_PATH }}
            ${{ env.PKG_PATH }}.sha256
          if-no-files-found: error

      - name: Create GitHub Release (never overwrite)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="v${PKG_VERSION}-${SHORT_SHA}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists — refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG" \
            "$PKG_PATH" "$PKG_PATH.sha256" \
            --title "Glotty $PKG_VERSION (${SHORT_SHA})" \
            --notes "Automated Developer ID signed + notarized build.

          - Commit: \`${GITHUB_SHA}\`
          - Tag: \`$TAG\`
          - Bundle ID: com.ruojunye.glotty
          - Team: 47D8DFFZQ4 (Simon Zu)
          - Universal: arm64 + x86_64
          - SHA-256: see \`${PKG_NAME}.sha256\`" \
            --target "$GITHUB_SHA"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          gh release view "$TAG" --json url -q .url

      - name: Cleanup temp keychain and secrets files
        if: always()
        run: |
          security delete-keychain "$HOME/Library/Keychains/glotty-ci.keychain-db" 2>/dev/null || true
          rm -f /tmp/glotty-app.p12 /tmp/glotty-installer.p12 /tmp/glotty-kc-pass
          echo "cleanup done"
